# Dapp publik LP -> nebu.ifajar.dev (pm2 lp-dapp, port 3016).
#   sudo cp deploy/nginx-nebu.ifajar.dev.conf /etc/nginx/sites-available/nebu.ifajar.dev
#   sudo ln -sf /etc/nginx/sites-available/nebu.ifajar.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nebu.ifajar.dev
server {
    listen 80;
    server_name nebu.ifajar.dev;
    location / {
        proxy_pass http://127.0.0.1:3016;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
