# Reverse proxy lp.ifajar.dev -> Next.js (pm2 lp-web, port 3005).
# Pasang:
#   sudo cp deploy/nginx-lp.ifajar.dev.conf /etc/nginx/sites-available/lp.ifajar.dev
#   sudo ln -sf /etc/nginx/sites-available/lp.ifajar.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lp.ifajar.dev   # SSL (blok 443 ditulis certbot)
server {
    listen 80;
    server_name lp.ifajar.dev;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
