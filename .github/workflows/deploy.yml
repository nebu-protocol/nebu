name: Deploy

# Deploy ke VPS lewat SSH saat push ke main (setelah CI hijau).
# Butuh repo secrets: VPS_SSH_KEY (private key), VPS_HOST, VPS_USER.
# Alternatif: deploy manual dari VPS dengan `bash deploy/vps-deploy.sh`.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/lp-auto
            bash deploy/vps-deploy.sh
